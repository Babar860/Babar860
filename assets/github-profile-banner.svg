      <text x="22" y="29" fill="#E0F2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Python | TypeScript | FastAPI | Node.js | React | PostgreSQL | AWS | AI</text>
    </g>
  </g>

