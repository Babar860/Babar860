    <text x="1" y="48" fill="#93C5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Software Engineer | AI Engineer | Full Stack Developer</text>
    <text x="1" y="92" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Building scalable backend systems, AI agents, RAG applications, and cloud solutions</text>
