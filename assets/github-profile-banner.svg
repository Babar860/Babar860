    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360" stroke="#94A3B8"/>
  </g>

  <g opacity="0.24">
    <path d="M84 62C155 35 226 47 306 84C410 131 503 126 590 84" stroke="#38BDF8" stroke-width="2"/>
    <path d="M52 292C188 231 282 257 390 291C505 327 646 319 760 260" stroke="#60A5FA" stroke-width="2"/>
    <path d="M655 38C746 92 835 92 921 57C1036 11 1120 47 1198 92" stroke="#22D3EE" stroke-width="2"/>
  </g>

  <g transform="translate(78 83)">
